allowBuilds:
  unrs-resolver: true
# Security overrides: transitive packages with published advisories.
# pnpm 11 no longer reads `pnpm.overrides` from package.json — this is
# the supported home for the setting.
overrides:
  '@babel/core@>=7.0.0 <8.0.0': '^7.29.6'
  'brace-expansion@>=1.0.0 <2.0.0': '^1.1.21'
  'brace-expansion@>=2.0.0 <3.0.0': '^2.1.7'
  'brace-expansion@>=4.0.0 <6.0.0': '^5.0.12'
  'braces@>=3.0.0 <4.0.0': '^3.0.3'
  'cross-spawn@>=7.0.0 <8.0.0': '^7.0.5'
  'diff@>=4.0.0 <5.0.0': '^4.0.4'
  'fast-uri@>=3.0.0 <4.0.0': '^3.1.8'
  'flatted@>=3.0.0 <4.0.0': '^3.4.2'
  'glob@>=10.0.0 <11.0.0': '^10.5.0'
  'handlebars@>=4.0.0 <5.0.0': '^4.7.10'
  'js-yaml@>=3.0.0 <4.0.0': '^3.15.2'
  'js-yaml@>=4.0.0 <5.0.0': '^4.3.2'
  'minimatch@>=3.0.0 <4.0.0': '^3.1.4'
  'minimatch@>=9.0.0 <10.0.0': '^9.0.7'
  'picomatch@>=2.0.0 <3.0.0': '^2.3.2'
  'serialize-javascript@>=6.0.0 <7.0.0': '^6.0.2'
  'serialize-javascript@>=7.0.0 <8.0.0': '^7.0.5'
  'webpack@>=5.0.0 <6.0.0': '^5.104.1'

auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-hp3w-g68c-fv3c
