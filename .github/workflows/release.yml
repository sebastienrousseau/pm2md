name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run test

      - name: Pack workspace tarballs
        run: |
          mkdir -p release-assets
          for pkg in packages/*/; do
            (cd "$pkg" && pnpm pack --pack-destination ../../release-assets)
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets/*.tgz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Compose release notes
        run: |
          VERSION="${TAG#v}"
          PREV_TAG="$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | head -n 1 || true)"

          HIGHLIGHTS="$(awk -v ver="$VERSION" '
            $0 == "## " ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' .github/release-highlights.md | sed '/./,$!d')"

          CHECKSUMS="$(cd release-assets && sha256sum *.tgz)"

          {
            echo "## Highlights ⭐️"
            echo ""
            if [ -n "$HIGHLIGHTS" ]; then
              echo "$HIGHLIGHTS"
            else
              echo "* Release $VERSION."
            fi
            echo ""
            echo "## What's Changed"
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"* %s by %an" "$PREV_TAG..$TAG"
            else
              git log --pretty=format:"* %s by %an" -n 20 "$TAG"
            fi
            echo ""
            echo ""
            echo "## Checksums"
            echo ""
            echo "SHA-256 of every asset attached to this release:"
            echo ""
            echo '```text'
            echo "$CHECKSUMS"
            echo '```'
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            fi
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "${{ github.event.repository.name }} ${GITHUB_REF_NAME#v}"
          body_path: release-notes.md
          files: release-assets/*.tgz
